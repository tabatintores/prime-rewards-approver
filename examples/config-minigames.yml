# Пример MiniGames для единой shop_orders; устанавливать в согласованный момент переключения.
# Укажите действующие данные MySQL непосредственно на сервере.
mysql:
  jdbcUrl: "jdbc:mysql://127.0.0.1:3306/external_data?useSSL=false&serverTimezone=UTC&characterEncoding=utf8"
  username: "user"
  password: "pass"
  minimumIdle: 0
  maximumPoolSize: 2
  connectionTimeoutMs: 5000
  validationTimeoutMs: 3000
  socket_timeout_ms: 15000

orders:
  # Идентификатор режима из shop_orders, например survival или skyblock_2.
  # Любое имя из 1–32 символов: a-z, 0-9, _ и -. Регистр приводится к нижнему.
  # Для совместимости classic — алиас survival; остальные имена используются напрямую.
  # Все режимы читают shop_orders. Старые таблицы заказов не поддерживаются.
  # Включайте новый источник вместе с новым backend после согласованного переноса истории.
  # Пустое значение отключает источник заказов до явной настройки.
  server: minigames
  # Уникальное имя экземпляра; например survival-1, duels-1, minigames-1.
  workerId: minigames-1
  query_timeout_seconds: 10

  # Проверять онлайн до резерва и повторно перед командой.
  # Отключайте только если команды этого сервера поддерживают офлайн-выдачу.
  requiresOnline: true

# Команды покупок только ЭТОГО сервера, выбранного в orders.server.
# Пример для MiniGames. На Survival/Duels укажите свои действующие команды.
# БД берётся из JDBC; таблица всегда shop_orders. Настройка table не нужна.
# Сохраняйте команды старых tier для уже созданных/оплаченных заказов.
tiers:
  coins_10:
    - "money give ${nickname} ${grant_qty}"
  coins_50:
    - "money give ${nickname} ${grant_qty}"
  coins_100:
    - "money give ${nickname} ${grant_qty}"
  coins_500:
    - "money give ${nickname} ${grant_qty}"
  coins_1000:
    - "money give ${nickname} ${grant_qty}"
  coins_5000:
    - "money give ${nickname} ${grant_qty}"

# Доступны прежние плейсхолдеры: ${nickname}, ${amount}, ${currency},
# ${order_id}, ${tier}, ${id}, ${grant_qty}, ${paid_at}, ${unitpay_id}, ${attempts}.
# Дополнительно: ${server}, ${quantity}, ${product_title}.
# grant_qty — готовая итоговая выдача из заказа. Не умножайте её на quantity!
# У перенесённых заказов quantity/product_title могут быть NULL: значения не угадываются.
# Шаблон с отсутствующим полем отклоняется; команды с grant_qty продолжают работать.
# Команды выполняются от консоли, последовательно; начальный / удаляется.
# Не более 16 команд на награду. Неизвестный tier остаётся невыданным.
# Токены shop_orders не снимаются автоматически даже после таймаута/перезапуска.

polling:
  intervalMs: 3000           # Интервал опроса источников; минимум 250 мс.
  batchSize: 50              # Размер SELECT; допустимо 1–500.
  maxConcurrentDeliveries: 4 # Общий предел работ; допустимо 1–32.
  dbMaxRetries: 3            # Повторы записи результата БД; без повтора команд.
  dbRetryBackoffMs: 300      # Задержка SQL-повтора; резерв не повторяется при неопределённом commit.

execution:
  requests_per_tick: 2       # Малые задачи основного потока: проверка онлайна или до 16 команд.
  command_timeout_ms: 15000  # Просроченная задача не начнёт выполнение позже.

backoff:
  baseMs: 2000
  maxMs: 120000
  jitterMs: 500

rateLimit:
  qps: 20                   # Общая частота выдач.

logging:
  level: "INFO"             # INFO или DEBUG; команды и токены не выводятся.

# Поддерживаются MiniMessage и старые &-цвета.
messages:
  no-permission: "<red>Недостаточно прав."
  usage: "<yellow>/primerewards reload <gray>— перезагрузить конфиг; <yellow>/primerewards stats <gray>— метрики."
  unknown-command: "<red>Неизвестная подкоманда."
  reload-started: "<yellow>Выдача остановлена. Ожидаем завершения работ и загружаем настройки."
  reload-busy: "<yellow>Загрузка или остановка предыдущих работ ещё выполняется."
  reload-success: "<green>Конфигурация перезагружена."
  reload-failed: "<red>Не удалось перезагрузить конфигурацию. Подробности в консоли."
  orders-disabled: "<red>Источник заказов отключён из-за ошибки настройки. Подробности в консоли."
  not-ready: "<yellow>Выдача ещё не запущена или перезагружается."
